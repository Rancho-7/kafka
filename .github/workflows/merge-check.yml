name: Client and Streams Tests

on:
  push:
    branches:
      - CI-TEST2

jobs:
  test-java11-compatibility:
    runs-on: ubuntu-latest
    name: Java 11 Compatibility Tests (Clients & Streams)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 11
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run Java 11 Compatibility Tests
        id: java11-tests
        uses: ./.github/actions/run-gradle
        with:
          test-task: ":clients:test :streams:test"
          timeout-minutes: 60
          test-catalog-path: ""
          build-scan-artifact-name: "build-scan-java11-clients-streams"
          run-new-tests: true
          run-flaky-tests: false
          test-retries: 1
          test-xml-output: "java11-clients-streams"
          test-repeat: 1
          test-verbose: false

      - name: Archive JUnit HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        id: archive-junit-html
        with:
          name: junit-reports-java11-clients-streams
          path: |
            **/build/reports/tests/*
          compression-level: 9
          if-no-files-found: ignore

      - name: Archive JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-java11-clients-streams
          path: |
            build/junit-xml/**/*.xml
          compression-level: 9
          if-no-files-found: ignore

      - name: Parse Test Results
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          JUNIT_REPORT_URL: ${{ steps.archive-junit-html.outputs.artifact-url }}
          THREAD_DUMP_URL: ""
          GRADLE_TEST_EXIT_CODE: ${{ steps.java11-tests.outputs.gradle-exitcode }}
        run: |
          python .github/scripts/junit.py \
           --path build/junit-xml >> $GITHUB_STEP_SUMMARY